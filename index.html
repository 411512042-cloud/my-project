<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一個網站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 採用低飽和度、舒適柔和的日落與晨曦漸層流動 */
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffd1ff, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: softGradient 16s ease infinite;
            color: #2d3748;
            overflow: hidden;
        }

        /* 緩慢柔和的背景流動，不刺眼 */
        @keyframes softGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 溫柔呼吸的環境光斑 (非常淡雅) */
        .ambient-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.45), transparent 70%);
            filter: blur(50px);
            animation: breathe 10s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes breathe {
            0% { transform: scale(0.9) translate(-30px, -20px); opacity: 0.5; }
            100% { transform: scale(1.15) translate(30px, 20px); opacity: 0.8; }
        }

        /* 極簡優雅的白底磨砂卡片 */
        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            padding: 3rem 4rem;
            border-radius: 24px;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.05),
                0 5px 15px rgba(0, 0, 0, 0.03);
            text-align: center;
            max-width: 520px;
            width: 88%;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.08),
                0 8px 20px rgba(0, 0, 0, 0.04);
        }

        .tag {
            display: inline-block;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1a202c;
            letter-spacing: -0.02em;
            margin-bottom: 0.8rem;
            line-height: 1.3;
        }

        p {
            font-size: 1.05rem;
            color: #718096;
            font-weight: 400;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .card {
                padding: 2.2rem 1.8rem;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <main class="card">
        <span class="tag">Welcome</span>
        <h1>這是我的第一個網站</h1>
        <p>簡單、清爽且溫暖的開始 🌱</p>
    </main>
</body>
</html>
